name: Enterprise DevSecOps Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Validate release quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check .

      - name: Run Bandit SAST
        run: bandit -r app

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Evaluate deployment gate
        run: python -m app.quality_gate --report reports/sample_report.json